name: Merged PR DMG
on:
  pull_request:
    branches: [main]
    types: [closed]
permissions:
  contents: read
jobs:
  signed-dmg:
    # Repository secrets are unavailable to forks; do not run fork code with them.
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/release.yml
    secrets: inherit
