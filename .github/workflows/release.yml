name: Release DMG
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: gitdesk-release
  cancel-in-progress: false
jobs:
  release-dmg:
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          # Build the merged commit, even if main advances while the job is queued.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Select release version
        id: version
        run: python3 scripts/release-version.py
      - name: Toolchain
        run: scripts/select-xcode.sh
      - name: Check signing configuration
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for field in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!field}" ]]; then echo "Falta el secreto $field" >&2; exit 1; fi
          done
      - name: Tests
        timeout-minutes: 10
        run: python3 scripts/test-ci.py
      - name: Import Developer ID and configure notarization
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          signing_keychain="$RUNNER_TEMP/gitdesk-signing.keychain-db"
          signing_password="$(openssl rand -base64 32)"
          echo "::add-mask::$signing_password"
          certificate_dir="$RUNNER_TEMP/gitdesk-certificate-material"
          mkdir -m 700 "$certificate_dir"
          trap 'rm -rf "$certificate_dir"' EXIT
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_dir/certificate.p12"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          # Keychain-exported PKCS#12 files may use RC2. OpenSSL 3 needs its
          # legacy provider to read that existing container (no TLS changes).
          pkcs12_options=()
          if [[ "$(openssl version)" == OpenSSL\ 3.* ]]; then pkcs12_options=(-legacy); fi
          # security import needs a regular, complete file rather than /dev/stdin.
          # Private material is confined to a 0700 directory and 0600 files.
          # Decryption passwords remain in the environment, never in arguments.
          openssl pkcs12 "${pkcs12_options[@]}" -in "$certificate_dir/certificate.p12" -passin env:MACOS_CERTIFICATE_PASSWORD -nodes -out "$certificate_dir/identity.pem"
          security import "$certificate_dir/identity.pem" -f pemseq -t agg -k "$signing_keychain" -T /usr/bin/codesign
          rm -rf "$certificate_dir"
          trap - EXIT
          security set-key-partition-list -S apple-tool:,apple: -k "$signing_password" "$signing_keychain" >/dev/null
          security list-keychains -d user -s "$signing_keychain" "$HOME/Library/Keychains/login.keychain-db"
          # notarytool reads its secure password prompt from stdin.
          printf '%s\n' "$APPLE_APP_SPECIFIC_PASSWORD" | xcrun notarytool store-credentials efby-gitdesk-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --keychain "$signing_keychain"
          echo "NOTARY_PROFILE=efby-gitdesk-ci" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Signed and notarized universal DMG
        run: scripts/build-dmg.sh --universal --notarize
      - uses: actions/upload-artifact@v4
        with:
          name: EFBY-Git-Desk-notarized-universal
          path: |
            dist/EFBY-Git-Desk.dmg
            dist/EFBY-Git-Desk.dmg.sha256
            dist/EFBY-Git-Desk/app-notary.json
            dist/EFBY-Git-Desk/dmg-notary.json
          if-no-files-found: error
      - name: Remove temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/gitdesk-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/gitdesk-certificate-material"
  publish-release:
    needs: release-dmg
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: EFBY-Git-Desk-notarized-universal
          path: dist
      - name: Verify downloaded DMG checksum
        working-directory: dist
        run: sha256sum --check EFBY-Git-Desk.dmg.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-dmg.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release-dmg.outputs.commit }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/EFBY-Git-Desk.dmg dist/EFBY-Git-Desk.dmg.sha256 --target "$RELEASE_COMMIT" --title "EFBY Git Desk $RELEASE_TAG" --generate-notes --latest
